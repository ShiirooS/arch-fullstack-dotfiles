$mainMod = SUPER

$scripts = ~/.config/hypr/scripts

bind = $mainMod, H, exec, $scripts/keyhints.sh # Ver atajos de teclado

bind = $mainMod, Space, exec, $terminal # Terminal
bind = $mainMod, E, exec, $fileManager # Gestor de archivos
bind = $mainMod, B, exec, $browser # Navegador

bind = $mainMod Shift Control, Escape, exit, # Salir de Hyprland
bind = $mainMod, Q, killactive, # Cerrar ventana
bind = $mainMod Shift, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill # Matar ventana

bind = $mainMod, F, exec, $scripts/float.sh # Alternar flotante (centrada, 70%)
bind = $mainMod, P, pseudo, # Pseudotile (dwindle)
bind = $mainMod, J, layoutmsg, togglesplit # Alternar split (dwindle)
bind = $mainMod Shift, F, fullscreen, 0 # Pantalla completa
bind = $mainMod, M, fullscreen, 1 # Maximizar (mantiene la barra)
bind = $mainMod, C, centerwindow, # Centrar ventana flotante
bind = $mainMod, Tab, workspace, previous # Workspace anterior
bind = $mainMod, S, togglespecialworkspace, magic # Mostrar/ocultar scratchpad
bind = $mainMod Alt, S, movetoworkspace, special:magic # Mandar ventana al scratchpad
bind = $mainMod Shift, left, movewindow, l # Mover ventana
bind = $mainMod Shift, right, movewindow, r # Mover ventana
bind = $mainMod Shift, up, movewindow, u # Mover ventana
bind = $mainMod Shift, down, movewindow, d # Mover ventana
binde = $mainMod Control, left, resizeactive, -40 0 # Redimensionar ventana
binde = $mainMod Control, right, resizeactive, 40 0 # Redimensionar ventana
binde = $mainMod Control, up, resizeactive, 0 -40 # Redimensionar ventana
binde = $mainMod Control, down, resizeactive, 0 40 # Redimensionar ventana

bind = $mainMod, L, exec, hyprlock # Bloquear pantalla
bind = $mainMod, Escape, exec, wlogout -b 5 # Menu de apagado
bind = $mainMod, R, exec, rofi -show drun # Lanzador de apps
bind = Alt, Space, exec, rofi -show drun # Lanzador de apps
bind = $mainMod, PERIOD, exec, rofi -show emoji # Selector de emojis
bind = $mainMod, V, exec, $scripts/clipboard.sh # Historial del portapapeles
bind = $mainMod, W, exec, $scripts/wallpaper.sh select # Elegir wallpaper
bind = $mainMod Shift, W, exec, $scripts/wallpaper.sh random # Wallpaper aleatorio
bind = $mainMod, N, exec, swaync-client -t -sw # Centro de notificaciones
bind = $mainMod Shift, S, exec, $scripts/screenshot.sh region # Captura de region
bind = , Print, exec, $scripts/screenshot.sh screen # Captura de pantalla completa
bind = $mainMod Shift, E, exec, $scripts/screenshot.sh edit # Captura y editar con swappy

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
