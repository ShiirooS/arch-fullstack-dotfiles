#------------------------------------------------------------------------------------



# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Disable blur for floating XWayland window
windowrule = no_blur on, match:class xwayland:1, match:float true

# Ventanas chicas que se abren desde waybar: flotantes y centradas.
windowrule {
    name = small-utilities-float
    match:class = ^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager|\.?blueman-manager-wrapped|nm-connection-editor|nwg-look|qt6ct|kvantummanager)$
    float = on
    size = 800 520
    center = on
}

# Dialogos de abrir/guardar archivo
windowrule {
    name = file-dialogs-float
    match:title = ^(Open File|Save File|Open Folder|Select a File|Guardar archivo|Abrir archivo).*$
    float = on
    size = 900 560
    center = on
}

# Picture-in-picture de Chromium: flotante, fijo en todos los workspaces, abajo a la derecha
windowrule {
    name = pip
    match:title = ^(Picture.in.picture)$
    float = on
    pin = on
    size = 480 270
    move = (monitor_w-500) (monitor_h-360)
}
