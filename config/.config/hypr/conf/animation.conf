# ███████║██╔██╗ ██║██║██╔████╔██║███████║   ██║   ██║██║   ██║██╔██╗ ██║
# ██╔══██║██║╚██╗██║██║██║╚██╔╝██║██╔══██║   ██║   ██║██║   ██║██║╚██╗██║
# ██║  ██║██║ ╚████║██║██║ ╚═╝ ██║██║  ██║   ██║   ██║╚██████╔╝██║ ╚████║
# ╚═╝  ╚═╝╚═╝  ╚═══╝╚═╝╚═╝     ╚═╝╚═╝  ╚═╝   ╚═╝   ╚═╝ ╚═════╝ ╚═╝  ╚═══╝
#------------------------------------------------------------------------



animations {
    enabled = yes

    # Sin rebote: con una curva que se pasa del tamano final (overshoot) las apps
    # (Chrome, Electron) no alcanzan a redibujar y se ven estiradas o temblando.
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 4, easeOutQuint, popin 90%
    animation = windowsOut, 1, 2, linear, popin 90%
    # Mover/redimensionar ventanas: corto para que el contenido no quede atras.
    animation = windowsMove, 1, 3, easeOutQuint

    animation = layers, 1, 3, easeOutQuint, fade
    animation = fade, 1, 3, easeOutQuint
    animation = border, 1, 3, easeOutQuint
    animation = workspaces, 1, 4, easeInOutCubic, slide
}
