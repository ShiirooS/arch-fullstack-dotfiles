general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  col.active_border = rgba(cba6f7ff)
  col.inactive_border = rgba(45475aff)
  layout = dwindle
}

decoration {
  rounding = 8
  blur {
    enabled = true
    size = 4
    passes = 2
  }
  shadow {
    enabled = true
    range = 12
    render_power = 2
  }
}

animations {
  enabled = true
  bezier = easeOut,0.16,1,0.3,1
  animation = windows,1,4,easeOut
  animation = border,1,4,easeOut
  animation = fade,1,3,easeOut
  animation = workspaces,1,4,easeOut
}

dwindle {
  pseudotile = true
  preserve_split = true
}

misc {
  disable_hyprland_logo = true
  force_default_wallpaper = 0
}
