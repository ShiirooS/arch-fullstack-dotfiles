exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator

# Setup fcitx5 (input method para CJK)
# TODO(shiiro): fcitx5 no esta instalado ni en ningun pkglist. Ademas, "export"
# como exec-once separado no funciona (cada exec-once corre en su propio shell
# aislado, la variable no llega a Hyprland ni a las apps); si se quiere usar
# fcitx5 hay que instalar fcitx5 (+ fcitx5-configtool/fcitx5-gtk/fcitx5-qt) y
# mover estas variables a environment.conf como "env = GTK_IM_MODULE,fcitx5" etc.
# exec-once = export GTK_IM_MODULE=fcitx5
# exec-once = export QT_IM_MODULE=fcitx5
# exec-once = export XMODIFIERS=@im=fcitx5
# exec-once = export INPUT_METHOD=fcitx5
# exec-once = export SDL_IM_MODULE=fcitx5
# exec-once = fcitx5

# Setup screen sharing
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Setup clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Setup themes
exec-once = ~/.config/hypr/scripts/gtk-theme.sh