# Basado en el .tmux.conf de ViegPhunt/Dotfiles.
# Plugins con tpm (AUR: tmux-plugin-manager). Instalarlos: prefijo + I
# (o ~/dotfiles/scripts/post-install.sh, que los instala solo).

# ─── Atajos ───────────────────────────────────────────────────────────────────
# Prefijo Ctrl-z en vez de Ctrl-b
unbind C-b
set-option -g prefix C-z
bind-key C-z send-prefix

# Recargar config
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux recargado"

# Ventanas y paneles nuevos en la carpeta actual
unbind N
bind N new-window -c "#{pane_current_path}"
unbind H
bind H split-window -h -c "#{pane_current_path}"
unbind V
bind V split-window -v -c "#{pane_current_path}"

# Renombrar ventana y sesion
unbind W
bind W command-prompt -I "#W" { rename-window "%%" }
unbind S
bind S command-prompt -I "#S" { rename-session "%%" }

# Cerrar ventana
unbind Q
bind Q confirm-before -p "kill-window #W? (y/n)" kill-window


# ─── Opciones ─────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g set-clipboard on
set -g status-position top
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",*:RGB"
set -g escape-time 0
set -g renumber-windows on


# ─── Plugins ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'viegphunt/catppuccin-tmux'
set -g @catppuccin_flavor 'mocha'


# ─── Estilo de ventanas ───────────────────────────────────────────────────────
set -g window-status-separator "|"
set -g status-left-length 0
set -g status-left " #{?client_prefix,#[fg=#{@thm_red} bold],#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_yellow} bold],#[fg=#{@thm_green} bold]}}TMUX #[fg=#{@thm_fg} bold]| "
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_number "#[bold]#I: #W  "
set -g @catppuccin_window_current_text ""
set -g @catppuccin_window_current_left_separator " "
set -g @catppuccin_window_current_middle_separator ""
set -g @catppuccin_window_current_right_separator ""
set -g @catppuccin_window_number_color "#{@thm_surface_0}"
set -g @catppuccin_window_number "#[fg=#{@thm_fg} bold]#I: #W  "
set -g @catppuccin_window_text ""
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_middle_separator ""
set -g @catppuccin_window_right_separator ""
set -g status-right "#[fg=#{@thm_peach} bold] [#S] #[fg=#{@thm_fg} bold]| "
set -ga status-right "#[fg=#{@thm_blue} bold]󰃰 %a %d/%m/%Y ~ %H:%M "


# ─── Iniciar plugins (tiene que ir al final) ──────────────────────────────────
# tpm del paquete de AUR; si no esta, el de ~/.tmux/plugins (git clone manual).
if-shell "test -x /usr/share/tmux-plugin-manager/tpm" \
    "run /usr/share/tmux-plugin-manager/tpm" \
    "run -b 'test -x ~/.tmux/plugins/tpm/tpm && ~/.tmux/plugins/tpm/tpm || true'"
